<title>Eligibility Chatbot</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --bot-bubble: #eef1f5;
    --bot-text: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --text: #e8e8ea;
      --muted: #9aa0aa;
      --border: #2b2f3a;
      --accent: #5b8def;
      --user-bubble: #3b5fd9;
      --user-text: #ffffff;
      --bot-bubble: #262a34;
      --bot-text: #e8e8ea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    width: min(560px, 94vw);
    height: min(860px, 94vh);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  header .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  #resetBtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  #resetBtn:hover { color: var(--text); border-color: var(--muted); }
  .headerActions { display: flex; gap: 8px; align-items: center; }
  #logsLink {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
  }
  #logsLink:hover { color: var(--text); border-color: var(--muted); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: #dc2626;
    font-size: 12px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--muted);
    font-style: italic;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 120px;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: default; }
</style>

<div class="app">
  <header>
    <div>
      <h1>Eligibility Chatbot</h1>
      <div class="sub">Tell it your name, age, and email to check eligibility.</div>
    </div>
    <div class="headerActions">
      <a id="logsLink" href="/view">Logs</a>
      <button id="resetBtn" type="button">Reset</button>
    </div>
  </header>

  <div id="messages"></div>

  <form id="chatForm">
    <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
  const USER_ID_KEY = "eligibility_chat_user_id";
  const userId =
    localStorage.getItem(USER_ID_KEY) ||
    (() => {
      const id = crypto.randomUUID();
      localStorage.setItem(USER_ID_KEY, id);
      return id;
    })();

  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("chatForm");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }
  inputEl.addEventListener("input", autoGrow);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      formEl.requestSubmit();
    }
  });

  // `text` is null for the bootstrap turn that opens a session -- the
  // server/model produces the opening message, nothing is hardcoded here.
  async function requestReply(text) {
    sendBtn.disabled = true;
    const typingEl = addMessage("thinking...", "typing");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, message: text }),
      });
      const data = await res.json();
      typingEl.remove();
      if (!res.ok) {
        addMessage(data.error || "Something went wrong.", "error");
        return;
      }
      addMessage(data.reply, "bot");
    } catch (err) {
      typingEl.remove();
      addMessage("Network error: could not reach the server.", "error");
    } finally {
      sendBtn.disabled = false;
    }
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage(text, "user");
    inputEl.value = "";
    autoGrow();
    requestReply(text);
  });

  resetBtn.addEventListener("click", async () => {
    await fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId }),
    });
    messagesEl.innerHTML = "";
    requestReply(null);
  });

  requestReply(null);
</script>
